      if(!o.plain && VS.phase==="move") txt='<span class="sgn blue">'+(mv.c.n<0?MINUS:"+")+' <input id="'+(side==="L"?"vsA":"vsB")+'" class="box" value="'+String(VS.v.move||"").replace(/"/g,"&quot;")+'" autocomplete="off" spellcheck="false" aria-label="what you add or subtract"></span>';
      if(!o.plain && VS.phase==="movew") cls="blue fresh";
      if(after("comb") && cancels(side)) cls+=" struck";

  const letters=(s.match(/[a-zA-Z]/g)||[]).map(function(c){ return c.toLowerCase(); });

let OWN=null;     /* {n, ans, V, done, missed} */
function ownTarget(it){
  const eq = it.g ? GUIDE[it.src].then : it.eq;
  const t=parseTwo(eq), p2=parseEquation(t ? t.s2 : eq).p;
  return {ans:p2.ans, V:p2.V, show: it.g ? "" : withP(Object.assign({}, t.p1, {dec:!!it.dec||t.dec}), eqH), dec:!!it.dec||(t&&t.dec)};
}
function startOwn(n){
  clearCheck(); $("prev").hidden=true; $("prev").innerHTML=""; clearPre(); S.idle=false; S.mode="own"; document.querySelector(".scroller").classList.remove("stack3"); $("eq").style.paddingLeft=""; P=null; TWO=null; $("eqErr").hidden=true; $("stagelab").hidden=true;
  const it=WORKSHEET[n-1], tg=ownTarget(it);
  OWN={n:n, ans:tg.ans, V:tg.V, show:tg.show, dec:tg.dec, done:false, missed:false, val:""};
  renderOwn(); renderQ(); fit();
  setTimeout(function(){ const b=$("ownIn"); if(b) b.focus({preventScroll:true}); },40);
}
function ownAnsH(){ const keep=P; P={dec:OWN.dec}; const h=H(OWN.ans); P=keep; return h; }
function renderOwn(){
  const eq=$("eq"); eq.className="own";
  eq.innerHTML=(OWN.show?'<div class="own-eq">'+OWN.show+'</div>':'')
    +'<div class="own-ans"><span>'+OWN.V+' =</span>'
    +(OWN.done ? '<span class="green">'+ownAnsH()+' &#10003;</span>'
               : '<input id="ownIn" class="box ownbox" value="'+String(OWN.val).replace(/"/g,"&quot;")+'" autocomplete="off" spellcheck="false" aria-label="Your answer">')
    +'</div>';
  $("panel").innerHTML=""; $("notebar").textContent="";
  const pb=$("promptbar"), n=nextQ(Q), nextLbl=(n?"Question "+lab(n):"Next")+" &rarr;";
  if(OWN.done){
    pb.innerHTML='<div class="row-between"><div class="prompt"><span class="green"><strong>'+OWN.V+' = '+ownAnsH()+' &#10003;</strong> Nice work on your own.</span></div>'
      +'<button class="next" id="ownNext" type="button">'+nextLbl+'<kbd class="nk">N</kbd></button></div>';
    $("ownNext").onclick=function(){ if(n) startQ(n); else randomStart(); };
  } else {
    pb.innerHTML='<div class="row-between"><div class="prompt"><span>Solve it on your paper, then type your answer and press Enter.</span></div>'
      +'<span class="ownbtns"><button class="turnin-link" id="ownHelp" type="button">Show me the steps</button>'
      +'<button class="next" id="ownCheck" type="button">Check</button></span></div>'
      +'<div class="missline">'+(OWN.missed?'&#10007; <span class="mchint">Not quite. Check your work, or press <strong>Show me the steps</strong>.</span>':'')+'</div>';
    $("ownCheck").onclick=checkOwn;
    $("ownHelp").onclick=function(){ startQ(OWN.n,true,{help:true}); };
    const b=$("ownIn");
    b.oninput=function(){ OWN.val=b.value; b.classList.remove("bad"); };
    b.onkeydown=function(e){ if(e.key==="Enter"){ e.preventDefault(); e.stopPropagation(); checkOwn(); } };
  }
}
function checkOwn(){
  const raw=$("ownIn") ? $("ownIn").value : "";
  if(!raw.trim()){ $("ownIn").focus(); return; }
  const v=parseVal(raw);
  if(v && same(v,OWN.ans)){
    OWN.done=true; DONE.add(Q); renderOwn(); renderQ(); fit();
    setTimeout(function(){ const b=$("ownNext"); if(b) b.focus({preventScroll:true}); },40);
    return;
  }
  OWN.missed=true; OWN.val=raw; renderOwn(); fit();
  const b=$("ownIn"); b.classList.add("bad"); b.focus({preventScroll:true});
}

/* ================= a question after solving (24, 25, 30, 31) ================= */
function followOf(){ return Q && S.mode==="eq" ? FOLLOW[src(Q)] : null; }
function startFollow(){
  const fu=followOf();
  S.sub="follow"; S.phase="ask"; S.misses=0; S.v={};
  $("panel").innerHTML='<div class="follow"><span>'+fu.q+'</span><input id="fu" class="box" autocomplete="off" spellcheck="false" aria-label="Your answer"></div>';
  renderPrompt(); fit();
  const el=$("fu");
  el.oninput=function(){ el.classList.remove("bad"); if(boxGood({t:fu.t,w:fu.w},el.value)) doneFollow(el.value); };
  el.onkeydown=function(e){
    if(e.key!=="Enter") return; e.preventDefault();
    if(!el.value.trim()) return;
    if(boxGood({t:fu.t,w:fu.w},el.value)) doneFollow(el.value);
    else { S.misses++; renderPrompt(); el.classList.add("bad"); fit(); }
  };
  setTimeout(function(){ el.focus({preventScroll:true}); },40);
}
function doneFollow(raw){
  const fu=followOf(), el=$("fu");
  el.classList.add("ok"); S.busy=true;
  setTimeout(function(){
    S.busy=false; S.fuDone=true; S.phase="write"; S.misses=0; DONE.add(Q);
    $("panel").innerHTML='<div class="follow"><span>'+fu.q+'</span><span class="gv">'+boxShow({t:fu.t},raw)+'</span></div>';
    renderPrompt(); renderQ(); fit();
    setTimeout(function(){ const b=$("wrote"); if(b) b.focus({preventScroll:true}); },40);
  },300);
}

/* ================= two-step equations =================
   A two-step problem is solved as two one-step problems in a row:
   step 1 treats the letter's whole term (6x, x/4, (1/2)x, or a group like (F − 32)) as one piece and undoes the + or −
   (or, for a group, the multiplying); step 2 solves what's left (6x = 324). */
let TWO=null;
function withP(p,fn){ const keep=P; P=p; try{ return fn(); } finally { P=keep; } }
function numText(r,dec){ if(r.d===1) return String(r.n); if(dec && terminates(r.d)) return decStr(r); return (r.n<0?"-":"")+Math.abs(r.n)+"/"+r.d; }
const TERM_PATS=[
  /\(([a-zA-Z])([+-])(\d+(?:\.\d+)?)\)/,        /* (F - 32) */
  /\((\d+)\/(\d+)\)\*?([a-zA-Z])/,               /* (1/5)a */
  /(\d+)\/(\d+)\*?([a-zA-Z])/,                    /* 1/5a */
  /(\d+)([a-zA-Z])\/(\d+)/,                        /* 4x/6 */
  /([a-zA-Z])\/([+-]?)(\d+(?:\.\d+)?)/,           /* x/4, p/-5 */
  /(\d+(?:\.\d+)?)\*?([a-zA-Z])/,                  /* 6x, 2.5w */
  /([a-zA-Z])/                                     /* x */
];
/* the letter's term as written; rep puts a number in for the letter (for the check) */
function termHTMLof(info,rep){
  const m=info.m, t=info.ti;
  const inMul=function(L){ return rep ? "("+rep+")" : L; };
  if(t===0) return "("+(rep||m[1])+" "+(m[2]==="-"?MINUS:"+")+" "+m[3]+")";
  if(t===1||t===2) return '<span class="tpair">'+dfracH(m[1],m[2])+inMul(m[3])+'</span>';
  if(t===3) return dfracH(m[1]+inMul(m[2]),m[3]);
  if(t===4) return dfracH(rep ? (rep.indexOf(MINUS)===0?"("+rep+")":rep) : m[1], (m[2]==="-"?MINUS:"")+m[3]);
  if(t===5) return m[1]+inMul(m[2]);
  return rep ? "("+rep+")" : m[1];
}
function parseTwo(raw){
  const r0=String(raw||"");
  if(/\d\s+\d+\s*\/\s*\d/.test(r0)) return null;          /* mixed numbers: leave those to the one-step reader */
  const s=r0.replace(/[−–—]/g,"-").replace(/[×·•]/g,"*").replace(/÷/g,"/").replace(/\s+/g,"").replace(/(\d),(?=\d{3}(?!\d))/g,"$1");
  const parts=s.split("=");
  if(parts.length!==2 || !parts[0] || !parts[1]) return null;
  const letters=s.match(/[a-zA-Z]/g)||[];
  if(letters.length!==1) return null;
  const L=letters[0], varLeft=/[a-zA-Z]/.test(parts[0]);
  const vs=varLeft?parts[0]:parts[1], cs=varLeft?parts[1]:parts[0];
  let m=null, ti=-1;
  for(let i=0;i<TERM_PATS.length;i++){ m=vs.match(TERM_PATS[i]); if(m){ ti=i; break; } }
  if(!m) return null;
  const hold="qzuk".split("").filter(function(c){ return c!==L.toLowerCase(); })[0];
  const side1=vs.slice(0,m.index)+hold+vs.slice(m.index+m[0].length);
  const r1=parseEquation(varLeft ? side1+"="+cs : cs+"="+side1);
  if(r1.err) return null;
  const p1=r1.p, dec=p1.dec;
  let s2, qval;
  if(p1.kind==="add"){
    if(ti===6 && !p1.negVar) return null;                   /* x + 7 = 12 is one step */
    const termTxt = ti===0 ? m[0] : m[0];
    const lhs=(p1.negVar?"-":"")+termTxt;
    s2 = varLeft ? lhs+"="+numText(p1.T,dec) : numText(p1.T,dec)+"="+lhs;
    qval = p1.negVar ? neg(p1.T) : p1.T;
  } else {
    if(ti!==0) return null;                                  /* 3x = 12 is one step */
    const inner=m[1]+m[2]+m[3];
    s2 = varLeft ? inner+"="+numText(p1.ans,dec) : numText(p1.ans,dec)+"="+inner;
    qval = p1.ans;
  }
  const r2=parseEquation(s2);
  if(r2.err) return null;
  const info={ti:ti, m:m, op:m[2]};
  p1.V=termHTMLof(info,null); p1.two=1;
  return {p1:p1, s2:s2, info:info, qval:qval, dec:dec, varLeft:varLeft};
}
function keepStage1(){
  const eq=$("eq"), c=eq.cloneNode(true);
  c.querySelectorAll("[data-a]").forEach(function(el){ el.remove(); });
  /* the spacer right before the last line goes too, so step 2 picks up where the line was */
  const kids=c.children; if(kids.length && kids[kids.length-1].classList.contains("spacer")) kids[kids.length-1].remove();
  c.querySelectorAll(".fresh").forEach(function(el){ el.classList.remove("fresh"); });
  c.querySelectorAll(".blue").forEach(function(el){ el.classList.remove("blue"); });
  c.querySelectorAll(".cancelling").forEach(function(el){ el.classList.remove("cancelling"); el.classList.add("struck"); });
  c.querySelectorAll(".xslash.draw").forEach(function(el){ el.classList.remove("draw"); el.classList.add("done"); });
  c.querySelectorAll(".slash.draw").forEach(function(el){ el.classList.remove("draw"); el.classList.add("dim"); });
  c.querySelectorAll(".ansbox").forEach(function(el){ el.remove(); });
  TWO.prevHTML=c.innerHTML; TWO.prevCls=eq.className;
}
/* line the equals sign of step 1's work up with step 2's */
/* line the blocks of work up on their equals signs by padding each one on the left,
   so the whole column stays inside the page (and gets measured when it's fitted to the screen) */
let PREB=null;      /* blocks of earlier work shown above: [{cls, html}] */
let CHK=null;       /* check lines in the original problem, when they're known ahead of time */
function showPre(){
  const pr=$("pre");
  if(PREB && PREB.length){
    pr.hidden=false; pr.classList.remove("chk-fade");
    pr.innerHTML=PREB.map(function(b){ return '<div class="'+b.cls+'"'+(b.style?' style="'+b.style+'"':'')+'>'+b.html+'</div>'; }).join("");
    requestAnimationFrame(function(){ drawArcs(pr,false); });
  } else { pr.hidden=true; pr.innerHTML=""; }
}
function clearPre(){ PREB=null; CHK=null; $("pre").hidden=true; $("pre").innerHTML=""; }
function alignPrev(){
  const pr=$("pre");
  const blocks=(pr.hidden?[]:Array.prototype.slice.call(pr.children)).concat([$("prev"),$("eq")].filter(function(b){ return !b.hidden; }));
  blocks.forEach(function(b){ b.style.paddingLeft=""; b.style.transform=""; });
  if(blocks.length<2) return;
  const xs=blocks.map(function(b){ const a=b.querySelector(".eqsign"); return a ? a.offsetLeft+a.offsetWidth/2 : null; });
  if(xs.some(function(x){ return x===null; })) return;
  const M=Math.max.apply(null,xs);
  blocks.forEach(function(b,i){ b.style.paddingLeft=(M-xs[i])+"px"; });
}
function startStage2(){
  const r=parseEquation(TWO.s2);
  P=r.p; P.two=2; if(TWO.dec) P.dec=true;
  Object.assign(S,{step:1, phase:"ask", misses:0, picked:false, busy:false, sub:"", raw:null, L:0, v:{}, mixDone:false, rw:false, fuDone:false});
  enter(); render(true);
}
/* the check, in the problem as it was first written */
function linesCheck(ls){
    return '<div class="checkline"><div class="cl-lab">Check it in the original problem</div>'
      +ls.map(function(l,i){ return '<div>'+l+(i===ls.length-1?' <span class="green">&#10003;</span>':'')+'</div>'; }).join("")+'</div>';
}
function twoCheck(){
  if(CHK){
    const ls=CHK;
    return '<div class="checkline"><div class="cl-lab">Check it in the original problem</div>'
      +ls.map(function(l,i){ return '<div>'+l+(i===ls.length-1?' <span class="green">&#10003;</span>':'')+'</div>'; }).join("")+'</div>';
  }
  const p1=TWO.p1, ans=P.ans, oldV=p1.V;
  const ansT = asDec(ans) ? (ans.n<0?MINUS:"")+decStr(absR(ans)) : H(ans);
  const out=withP(p1,function(){
    p1.V=termHTMLof(TWO.info,ansT); const l1=eqH();
    p1.V=p1.kind==="add" ? PH(TWO.qval) : "("+H(TWO.qval)+")"; const l2=eqH();
    p1.V=oldV;
    return [l1,l2,H(p1.C)+" = "+H(p1.C)];
  });
  return '<div class="checkline"><div class="cl-lab">Check it in the original problem</div>'
    +'<div>'+out[0]+'</div><div>'+out[1]+'</div><div>'+out[2]+' <span class="green">&#10003;</span></div></div>';
}

/* ================= starting a problem ================= */
function start(raw,focus,opts){
  const two=parseTwo(raw);
  const r=two ? {p:two.p1} : parseEquation(raw);
  if(r.err) r.err="I can't read that yet. Try something like 3x + 4 = 25, x/4 + 3 = 11, (1/2)x + 4 = 12, or 7(a + 2) = 91.";
  const err=$("eqErr");
  if(r.err){
    /* can't be solved here: clear the board and say why, in the middle of the screen */
    clearCheck(); S.idle=true; err.hidden=true; TWO=null; $("stagelab").hidden=true; $("prev").hidden=true; clearPre(); document.querySelector(".scroller").classList.remove("stack3"); $("eq").style.paddingLeft="";
    const eq=$("eq"); eq.className="eq"; eq.innerHTML='<div class="badeq">'+r.err+'</div>';
    $("panel").innerHTML=""; $("promptbar").innerHTML=""; $("notebar").textContent="";
    $("eqIn").focus({preventScroll:true}); fit();
    return false;
  }
  S.idle=false; S.mode="eq";
  err.hidden=true;
  clearCheck(); P=r.p; served++;
  TWO=two||null;
  if(TWO && opts && opts.dec){ TWO.dec=true; }
  if(TWO && TWO.dec) P.dec=true;
  Object.assign(S,{step:0, phase:"write", misses:0, picked:false, busy:false, sub:"", raw:null, L:0, v:{}, mixDone:false, rw:false, fuDone:false});
  PREB = opts && opts.pre ? opts.pre : null;
  CHK = opts && opts.check ? opts.check : null;
  if(opts && opts.skipCopy){ S.step=1; enter(); }
  render(focus);
  return true;
}
function rint(a,b){ return Math.floor(Math.random()*(b-a+1))+a; }
function pick(a){ return a[Math.floor(Math.random()*a.length)]; }
function fmt(n){ return n<0 ? "-"+Math.abs(n) : String(n); }
function coprime(q,lo,hi){ let p=rint(lo,hi), t=0; while((gcd(p,q)!==1||p===q) && t++<50) p=rint(lo,hi); return p; }
/* a number as a student would type it: 7, -3/4, or a mixed number like -2 1/3 */
function typed(r,allowMixed){
  const sg=r.n<0?"-":"", a=Math.abs(r.n);
  if(r.d===1) return sg+a;
  if(allowMixed && a>r.d) return sg+Math.floor(a/r.d)+" "+(a%r.d)+"/"+r.d;
  return sg+a+"/"+r.d;
}
function randomEq(){
  const V=pick(["x","y","n","k","m","w","t","b"]);
  const nz=function(lo,hi){ let v=0; while(!v) v=rint(lo,hi); return v; };
  const x=nz(-9,9), a=nz(-9,9);
  let c=nz(-9,9); while(c===a) c=nz(-9,9);
  const b=rint(-15,15), d=(a-c)*x+b;
  const term=function(k,lead){ const t=(Math.abs(k)===1?"":Math.abs(k))+V; return lead ? (k<0?"-":"")+t : (k<0?" - ":" + ")+t; };
  const num=function(k,lead){ return lead ? String(k) : (k<0?" - ":" + ")+Math.abs(k); };
  const side=function(k,cst){
    if(!cst) return term(k,true);
    return Math.random()<0.7 ? term(k,true)+num(cst,false) : num(cst,true)+term(k,false);
  };
  return side(a,b)+" = "+side(c,d);
}
function randomStart(){ Q=0; const e=randomEq(); $("eqIn").value=e; startVS(e); }

/* ================= wiring ================= */
function init(){
  $("entry").addEventListener("submit",function(e){ e.preventDefault(); Q=0; const v=$("eqIn").value; if(isBothSides(v)) startVS(v); else start(v,true); });
  $("randBtn").onclick=randomStart;
  /* clicking into the equation box clears it, so a new one can be typed straight in */
  $("eqIn").addEventListener("focus",function(){ if(!S.idle) this.value=""; });
  /* keyboard: A/+ S/- M/x D/ pick the move; Enter or N moves on after writing a step */
  document.addEventListener("keydown",function(e){
    if(e.ctrlKey||e.metaKey||e.altKey||S.idle) return;
    const a=document.activeElement;
    if(a && (a.tagName==="INPUT"||a.tagName==="TEXTAREA")) return;
    if(S.mode==="vs"){
      if((e.key==="n"||e.key==="N"||e.key==="Enter") && $("vsNext")){ e.preventDefault(); $("vsNext").click(); return; }
      if(VS && VS.phase==="op"){
        const map={"a":"add","+":"add","s":"sub","-":"sub","−":"sub","m":"mul","x":"mul","*":"mul","d":"div","/":"div"};
        const k=map[e.key.toLowerCase()];
        if(k){ e.preventDefault(); vsOp(k); }
      }
      return;
    }
    if(S.mode==="own"){
      if((e.key==="n"||e.key==="N"||e.key==="Enter") && $("ownNext")){ e.preventDefault(); $("ownNext").click(); }
      return;
    }
    if(S.mode==="g"){
      if((e.key==="n"||e.key==="N"||e.key==="Enter") && $("gNext")){ e.preventDefault(); $("gNext").click(); }
      return;
    }
    if(e.key==="Enter" && !(a && a.tagName==="BUTTON")){
      if(S.step>=7){ e.preventDefault(); randomStart(); return; }
      if(S.phase==="write"){ e.preventDefault(); goNext(); return; }
    }
    if(e.key==="n" || e.key==="N"){
      const btn=$("wrote")||$("nextBtn");
      if(btn){ e.preventDefault(); btn.click(); return; }
    }
    if(S.step===2 && S.phase==="ask"){
      const map={"a":"add","+":"add","s":"sub","-":"sub","−":"sub","m":"mul","x":"mul","*":"mul","d":"div","/":"div"};
      const k=map[e.key.toLowerCase()];
      if(k){ e.preventDefault(); judgeOp(k); }
    }
  });
  window.addEventListener("resize",function(){ alignPrev(); fit(); placeBox(); });
  startQ(1,false);
}
if(typeof document!=="undefined" && document.getElementById("eq")) init();
</script>
